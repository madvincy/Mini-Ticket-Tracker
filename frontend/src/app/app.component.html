<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Lodwar Services ticket desk"><span class="brand-mark">LS</span><span class="brand-name">Lodwar <span>Services</span></span></a>
    <div class="topbar-meta"><span class="live-dot"></span> SERVICE DESK <span class="meta-divider">/</span> TICKETS</div>
    <div class="today">OPERATIONS</div>
  </header>

  <main class="workspace">
    <section class="page-heading">
      <div><p class="eyebrow">CUSTOMER OPERATIONS <span>·</span> NAIROBI</p><h1>Ticket desk<span class="title-period">.</span></h1><p class="subheading">Keep every service request moving.</p></div>
      <div class="heading-date"><span class="date-mark"></span> Ticket queue</div>
    </section>

    <app-ticket-stats [stats]="stats()" />

    @if (error()) {
      <div class="error-banner" role="alert">
        <span class="error-icon" aria-hidden="true">!</span><span>{{ error() }}</span>
        <app-button variant="quiet" ariaLabel="Dismiss error" title="Dismiss error" (click)="error.set('')">×</app-button>
      </div>
    }

    <div class="content-grid">
      <app-ticket-table
        [tickets]="tickets()"
        [loading]="loading()"
        [filter]="filter()"
        [page]="page()"
        [total]="pageMeta().total"
        [totalPages]="pageMeta().totalPages"
        [search]="search()"
        [from]="from()"
        [to]="to()"
        [sortBy]="sortBy()"
        [sortOrder]="sortOrder()"
        (filterChange)="changeFilter($event)"
        (searchChange)="changeSearch($event)"
        (dateRangeChange)="changeDateRange($event)"
        (sortChange)="changeSort($event)"
        (clearFilters)="clearFilters()"
        (pageChange)="movePage($event)"
        (statusChange)="changeStatus($event.id, $event.status)"
        (ticketOpen)="openTicket($event)"
      />
      <app-ticket-form [saving]="saving()" (submitted)="createTicket($event)" />
    </div>
    <footer class="page-footer"><span>LODWAR SERVICES <i>·</i> SUPPORT OPERATIONS</span><span>MINI TICKET TRACKER <i>·</i> V1.0</span></footer>
  </main>
  <app-toast />
  <app-ticket-details-dialog
    [open]="detailsOpen()"
    [loading]="detailsLoading()"
    [error]="detailsError()"
    [ticket]="selectedTicket()"
    (closed)="closeTicketDetails()"
  />
</div>
